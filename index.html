<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하루별점</title>
<style>
:root{--bg:#12131c;--panel:#1c1d2a;--line:#33354a;--tx:#f2f2f7;--dim:#6b6d82;--off:#33344a;--btn:#fff;--btntx:#12131c;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f6f6fa;--panel:#fff;--line:#dcdce6;--tx:#16171f;--dim:#8d8ea5;--off:#dcdde8;--btn:#16171f;--btntx:#fff;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:14px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;margin:2px 0 16px}
h1{font-size:28px;margin:0;letter-spacing:-.5px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sw{position:relative;width:60px;height:32px;border-radius:16px;background:var(--panel);border:1px solid var(--line);padding:0}
.knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;transition:transform .2s}
:root[data-theme="dark"] .knob{transform:translateX(28px)}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar h2{font-size:26px;margin:0;flex:1;letter-spacing:-.5px}
.ic{width:38px;height:38px;border-radius:12px;background:var(--panel);font-size:16px}
.sum{color:var(--dim);font-size:14px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{text-align:center;color:var(--dim);font-size:13px;padding:8px 0}
.c{aspect-ratio:2/3;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;color:var(--dim);position:relative;overflow:hidden}
.c.out{opacity:.3;pointer-events:none}
.c.fut{opacity:.5;pointer-events:none}
.r{--a:#ff6b5b;--b:#b8281f}.y{--a:#ffc83d;--b:#b8860b}.g{--a:#3ddc84;--b:#15803d}.p{--a:#b66bff;--b:#5b21b6}
.c.has{background:linear-gradient(160deg,var(--a),var(--b));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.c.has b{font-size:19px;line-height:1}
.c.has small{font-size:11px;opacity:.9;margin-top:2px}
.c.has i{position:absolute;top:4px;left:5px;font-style:normal;font-size:10px;opacity:.8}
.c.today{outline:2px solid var(--tx);outline-offset:-2px;color:var(--tx);font-size:30px;font-weight:300}
.c.today.has{color:#fff;font-size:17px;font-weight:400}
.c.has.p{box-shadow:0 0 0 1px #ecd5ff inset,0 0 14px 2px rgba(182,107,255,.7);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 1px #ecd5ff inset,0 0 22px 5px rgba(182,107,255,.9)}}
@media (prefers-reduced-motion:reduce){.c.has.p{animation:none}}
.sheet-bg{--a:#8d8ea5;position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet-bg.on{display:flex}
.sheet{max-height:100%;overflow-y:auto;box-shadow:0 120px 0 var(--panel),0 240px 0 var(--panel),0 360px 0 var(--panel),0 480px 0 var(--panel),0 600px 0 var(--panel)}
.sheet-bg.kb .sheet{padding:12px 18px 18px}
.sheet-bg.kb textarea{height:50px}
.sheet{background:var(--panel);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0;font-size:16px;text-align:center}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.num{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:22px 0 14px}
.d{width:34px;text-align:center;font-size:34px;font-weight:700;line-height:1.1;border-bottom:2px solid var(--line);color:var(--a)}
.dot{font-size:26px;font-weight:700;line-height:1.3}
.num input{position:absolute;left:50%;top:0;width:1px;height:1px;opacity:0;font-size:16px;pointer-events:none}
.d{cursor:pointer}
.sheet.p .d{text-shadow:0 0 18px var(--a)}
.stars{display:flex;justify-content:center;touch-action:none;user-select:none;margin:0 auto 22px}
.st{font-size:34px;line-height:1.1;background:linear-gradient(90deg,var(--a) var(--f,0%),var(--off) var(--f,0%));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hint{text-align:center;color:var(--dim);font-size:12px;margin:0 0 12px}
textarea{width:100%;height:76px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:16px;padding:10px;resize:none}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:12px;border-radius:12px;background:var(--bg);font-weight:600}
.row .pri{background:var(--btn);color:var(--btntx);flex:2}
.tools{display:flex;gap:8px;margin-top:22px}
.tools button{flex:1;padding:11px;border-radius:12px;background:var(--panel);font-size:14px;color:var(--dim)}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>하루별점</h1>
    <button class="sw" id="th" aria-label="다크 모드 전환"><span class="knob" id="knob"></span></button>
  </div>
  <div class="bar">
    <button class="ic" id="prev" aria-label="이전 달">◀</button>
    <h2 id="ttl"></h2>
    <button class="ic" id="next" aria-label="다음 달">▶</button>
  </div>
  <p class="sum" id="sum"></p>
  <div class="grid" id="grid"></div>
  <div class="tools">
    <button id="exp">내보내기</button>
    <button id="imp">가져오기</button>
    <button id="tdy">오늘로</button>
  </div>
  <input type="file" id="file" accept="application/json" hidden>
</main>

<div class="sheet-bg" id="bg">
  <div class="sheet" id="sheet">
    <h3 id="sd"></h3>
    <div class="num">
      <span class="d" id="n1"></span><span class="dot">.</span><span class="d" id="n2"></span>
      <input id="ni" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="별점 숫자 입력">
    </div>
    <div class="stars" id="stars"></div>
    <textarea id="memo" placeholder="오늘 하루를 한 줄로 남겨 보세요"></textarea>
    <div class="row">
      <button id="del">삭제</button>
      <button id="cls">닫기</button>
      <button class="pri" id="sv">저장</button>
    </div>
  </div>
</div>

<script>
var KEY="haru-byeoljeom-v1", TK="haru-theme", data={}, cur=new Date(), sel=null, val=null;
cur=new Date(cur.getFullYear(),cur.getMonth(),1);
function $(i){return document.getElementById(i)}
function load(){try{data=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){data={}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function ds(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function cls(v){return v>=5?"p":v>=4?"g":v>=3?"y":"r"}
function digs(v){var t=Math.round(v*10);return String(Math.floor(t/10))+String(t%10)}
function setTheme(t){document.documentElement.dataset.theme=t;$("knob").textContent=t==="dark"?"🌙":"☀️";try{localStorage.setItem(TK,t)}catch(e){}}
(function(){var t=null;try{t=localStorage.getItem(TK)}catch(e){}
  if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";setTheme(t)})();
$("th").onclick=function(){setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark")};
function render(){
  var y=cur.getFullYear(),m=cur.getMonth(),h="";
  $("ttl").textContent=y+"."+(m+1)+".";
  ["월","화","수","목","금","토","일"].forEach(function(w){h+='<div class="wd">'+w+'</div>'});
  var off=(new Date(y,m,1).getDay()+6)%7, n=new Date(y,m+1,0).getDate();
  var total=Math.ceil((off+n)/7)*7, today=ds(new Date()), sum=0, cnt=0;
  for(var i=0;i<total;i++){
    var d=new Date(y,m,1-off+i), k=ds(d), out=d.getMonth()!==m, e=data[k], c="c";
    if(out)c+=" out"; else if(k>today)c+=" fut";
    if(k===today)c+=" today";
    if(e&&!out){sum+=e.r;cnt++;
      h+='<button class="'+c+' has '+cls(e.r)+'" data-d="'+k+'"><i>'+d.getDate()+'</i><b>'+e.r.toFixed(1)+'</b><small>★</small></button>';
    }else h+='<button class="'+c+'" data-d="'+k+'">'+(k===today?'+':d.getDate())+'</button>';
  }
  $("grid").innerHTML=h;
  $("sum").textContent=cnt?("기록 "+cnt+"일 · 평균 ★ "+(sum/cnt).toFixed(2)):"이번 달 기록이 아직 없어요";
}
function paint(){
  var s=$("ni").value;
  $("n1").textContent=s.length?s[0]:"0";
  $("n2").textContent=s.length>1?s[1]:"0";
  $("n2").style.opacity=s.length===1?".35":"1";
  $("n1").style.borderBottomColor=s.length===0?"var(--tx)":"";
  $("n2").style.borderBottomColor=s.length===1?"var(--tx)":"";
  $("sheet").className="sheet"+(val===null?"":" "+cls(val));
  var el=document.querySelectorAll(".st"),v=val||0;
  for(var i=0;i<5;i++)el[i].style.setProperty("--f",Math.max(0,Math.min(1,v-i))*100+"%");
}
function open_(k){
  sel=k;var e=data[k],p=k.split("-"),dt=new Date(+p[0],+p[1]-1,+p[2]);
  $("sd").textContent=p[0]+"."+(+p[1])+"."+(+p[2])+" "+["일","월","화","수","목","금","토"][dt.getDay()]+"요일";
  val=e?e.r:null;$("ni").value=e?digs(e.r):"";$("memo").value=e?(e.m||""):"";
  $("del").style.display=e?"":"none";paint();$("bg").classList.add("on");fit();$("ni").focus();
}
function close_(){$("bg").classList.remove("on");$("ni").blur()}
(function(){
  var st=$("stars"),h="";for(var i=0;i<5;i++)h+='<span class="st">★</span>';st.innerHTML=h;
  function pick(ev){var r=st.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width;
    val=Math.max(.5,Math.min(5,Math.ceil(x*10)/2));$("ni").value=digs(val);paint()}
  st.addEventListener("pointerdown",function(ev){st.setPointerCapture(ev.pointerId);pick(ev)});
  st.addEventListener("pointermove",function(ev){if(ev.buttons)pick(ev)});
})();
$("ni").oninput=function(){
  var s=this.value.replace(/\D/g,"");if(s.length>2)s=s.slice(-1);
  if(s.length&&+s[0]>5)s="5"+(s[1]||"");
  if(s.length>1&&+s[0]===5)s="50";
  this.value=s;val=s.length?(+s[0]+(s.length>1?+s[1]/10:0)):null;paint();
};
$("n1").onclick=function(){$("ni").value="";val=null;paint();$("ni").focus()};
$("n2").onclick=function(){var s=$("ni").value;if(s.length){$("ni").value=s[0];val=+s[0];paint()}$("ni").focus()};
$("grid").addEventListener("click",function(ev){var b=ev.target.closest("[data-d]");if(b)open_(b.dataset.d)});
$("sv").onclick=function(){
  if(val===null){alert("별점을 먼저 입력해 주세요");return}
  data[sel]={r:Math.round(val*10)/10,m:$("memo").value.trim()};save();close_();render();
};
$("del").onclick=function(){delete data[sel];save();close_();render()};
$("cls").onclick=close_;
$("bg").addEventListener("click",function(ev){if(ev.target.id==="bg")close_()});
$("prev").onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
$("next").onclick=function(){cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
$("tdy").onclick=function(){var t=new Date();cur=new Date(t.getFullYear(),t.getMonth(),1);render()};
$("exp").onclick=function(){
  var b=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="haru-byeoljeom-"+ds(new Date())+".json";a.click();
};
$("imp").onclick=function(){$("file").click()};
$("file").onchange=function(ev){
  var f=ev.target.files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){try{Object.assign(data,JSON.parse(rd.result));save();render();alert("가져왔어요")}catch(e){alert("올바른 JSON 파일이 아니에요")}};
  rd.readAsText(f);
};
function fit(){var v=window.visualViewport,b=$("bg"),h=0;if(b.classList.contains("kb")){h=v?Math.round(window.innerHeight-v.height-v.offsetTop):0;if(h<100)h=Math.round(screen.height*(/Safari\//.test(navigator.userAgent)?.262:.335))}b.style.paddingBottom=h+"px"}
if(window.visualViewport){visualViewport.addEventListener("resize",fit);visualViewport.addEventListener("scroll",fit)}
$("bg").addEventListener("focusin",function(){this.classList.add("kb");fit()});
$("bg").addEventListener("focusout",function(){var b=this;setTimeout(function(){if(!b.contains(document.activeElement)){b.classList.remove("kb");fit()}},50)});
load();render();
</script>
</body>
</html>
